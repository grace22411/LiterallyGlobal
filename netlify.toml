[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  APP_URL = "https://www.literallyglobal.com"

# Explicitly enable the Next.js adapter for GitHub/API-created Netlify sites.
# Configure private provider credentials in Netlify environment variables.

[[plugins]]
  package = "@netlify/plugin-nextjs"
